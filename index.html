const u8 = (s) => Uint8Array.from(atob(s), c => c.charCodeAt(0));
function checkin(label, how) {
  if (!CHECKIN || !CHECKIN.url) return;
  try {
    const fd = new FormData();
    fd.append(CHECKIN.whoField, label);
    if (CHECKIN.howField) fd.append(CHECKIN.howField, how);
    if (navigator.sendBeacon) { navigator.sendBeacon(CHECKIN.url, fd); }
    else { fetch(CHECKIN.url, { method: 'POST', mode: 'no-cors', body: fd }).catch(() => {}); }
  } catch (e) {}
}
async function openWithMaster(masterRaw) {
  const key = await crypto.subtle.importKey('raw', masterRaw, {name:'AES-GCM'}, true, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:IV}, key, DATA);
  return new TextDecoder().decode(pt);
}
function render(html) { document.open(); document.write(html); document.close(); }
async function tryEntry(entry, pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const kek = await crypto.subtle.deriveKey({name:'PBKDF2', salt:u8(entry.salt), iterations:150000, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const masterRaw = await crypto.subtle.decrypt({name:'AES-GCM', iv:u8(entry.wiv)}, kek, u8(entry.wrapped));
  return new Uint8Array(masterRaw);
}
async function tryStored() {
  const raw = localStorage.getItem('ll_key');
  const who = localStorage.getItem('ll_who');
  if (!raw || !who) return;
  try {
    const html = await openWithMaster(u8(raw));
    const last = parseInt(localStorage.getItem('ll_last_ping') || '0', 10);
    if (Date.now() - last > 2 * 60 * 60 * 1000) { checkin(who, 'remembered'); localStorage.setItem('ll_last_ping', String(Date.now())); }
    render(html);
  } catch (e) { localStorage.removeItem('ll_key'); localStorage.removeItem('ll_who'); }
}
async function unlock() {
  const pw = document.getElementById('pw').value;
  const err = document.getElementById('err');
  err.textContent = '';
  const results = await Promise.allSettled(ENTRIES.map(e => tryEntry(e, pw)));
  const hit = results.findIndex(r => r.status === 'fulfilled');
  if (hit < 0) { err.textContent = 'Wrong password — try again.'; return; }
  const label = ENTRIES[hit].label;
  const masterRaw = results[hit].value;
  try {
    const html = await openWithMaster(masterRaw);
    checkin(label, 'typed');
    if (document.getElementById('rem').checked) {
      localStorage.setItem('ll_key', btoa(String.fromCharCode(...masterRaw)));
      localStorage.setItem('ll_who', label);
      localStorage.setItem('ll_last_ping', String(Date.now()));
    }
    render(html);
  } catch (e) { err.textContent = 'Wrong password — try again.'; }
}
document.getElementById('go').addEventListener('click', unlock);
document.getElementById('pw').addEventListener('keydown', (e) => { if (e.key === 'Enter') unlock(); });
tryStored();
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(() => {}); }
